[mod]
id = "itemphysiclite"
version = "1.6.13"
priority = 100

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "port_itemphysiclite"
source = "runtime.rs"

[[module]]
id = "game_side"
file = "crates/horizon-client/src/game.rs"
name = "port_itemphysiclite_game"
source = "game_side.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]


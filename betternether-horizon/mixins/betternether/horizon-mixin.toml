[mod]
id = "betternether"
version = "26.302.1"
priority = 100

# Raw targets are exact functions of one Horizon commit: build on that commit.
[compatibility]
horizon_revision = "a46ce6898bd72016e061aaec1afc1375b384deac"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "port_betternether"
source = "runtime.rs"

[[module]]
id = "game_side"
file = "crates/horizon-client/src/game.rs"
name = "port_betternether_game"
source = "game_side.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]


[mod]
id = "itemphysic"
version = "1.8.18"
priority = 100

# Raw targets are exact functions of one Horizon commit: build on that commit.
[compatibility]
horizon_revision = "a46ce6898bd72016e061aaec1afc1375b384deac"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "port_itemphysic"
source = "runtime.rs"

[[module]]
id = "game_side"
file = "crates/horizon-client/src/game.rs"
name = "port_itemphysic_game"
source = "game_side.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

